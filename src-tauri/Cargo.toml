[package]
name = "smart-notify"
version = "1.0.0"
description = "Production-grade, ultra-lightweight Smart Notify overlay for Windows 11"
authors = ["Smart Notify Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
dirs = "5.0"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "UI_Notifications",
    "UI_Notifications_Management",
    "UI_ViewManagement",
    "ApplicationModel",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Threading",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
